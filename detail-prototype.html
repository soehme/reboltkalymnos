<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Prototype</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111210;
      --surface: #1c1c1a;
      --surface2: #242422;
      --border: rgba(255,255,255,0.09);
      --accent: #5a8fc4;
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.4);
      --radius: 8px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eff1f4;
        --surface: #ffffff;
        --surface2: #e4e7ec;
        --border: rgba(0,0,0,0.08);
        --accent: #1a56db;
        --text: #111827;
        --muted: rgba(17,24,39,0.45);
      }
    }

    html, body {
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      background: var(--bg);
      color: var(--text);
    }

    /* ── App shell: two panels side by side ── */
    .app {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.36s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .app.detail-open {
      transform: translateX(-50%);
    }

    .panel {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── List panel ── */
    .list-header {
      flex-shrink: 0;
      padding: 16px 16px 12px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .list-header h1 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .list-header p {
      font-size: 18px;
      font-weight: 700;
    }

    .route-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 16px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .card {
      background: var(--surface);
      padding: 13px 15px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .card:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .card:last-child  { border-radius: 0 0 var(--radius) var(--radius); }
    .card:only-child  { border-radius: var(--radius); }
    .card:not(:last-child) { border-bottom: 1px solid var(--border); }
    .card:active { background: var(--surface2); }

    .card .crag {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: rgba(240,237,232,0.45);
      margin-bottom: 2px;
    }
    @media (prefers-color-scheme: light) {
      .card .crag { color: rgba(17,24,39,0.38); }
    }
    .card .route-name {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 3px;
    }
    .card .job-date {
      font-size: 14px;
      color: rgba(240,237,232,0.72);
    }
    @media (prefers-color-scheme: light) {
      .card .job-date { color: rgba(17,24,39,0.68); }
    }
    .card .job-date .date {
      color: rgba(240,237,232,0.45);
    }
    @media (prefers-color-scheme: light) {
      .card .job-date .date { color: rgba(17,24,39,0.38); }
    }

    /* ── Detail panel ── */
    .detail-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .detail-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .btn-back {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text);
      opacity: 0.6;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .btn-back:active { opacity: 0.3; }
    .btn-back svg { flex-shrink: 0; }


    .detail-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 32px 24px 40px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    }

    .detail-fields {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-bottom: 40px;
    }

    .detail-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .detail-field p {
      font-size: 17px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 32px;
    }

    p.detail-route-name {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.3px;
    }

    .btn-crag-filter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 13px 15px;
      border-radius: var(--radius);
      background: var(--surface);
      border: none;
      color: var(--text);
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-crag-filter:active { background: var(--surface2); }
    .btn-crag-filter svg { color: var(--muted); flex-shrink: 0; }
  </style>
</head>
<body>

<div class="app" id="app">

  <!-- LIST PANEL -->
  <div class="panel">
    <div class="list-header">
      <h1>697 routes</h1>
      <p>Rebolt Kalymnos</p>
    </div>
    <ul class="route-list" id="route-list"></ul>
  </div>

  <!-- DETAIL PANEL -->
  <div class="panel detail-panel">
    <div class="detail-header">
      <button class="btn-back" id="btn-back">
        <svg width="10" height="17" viewBox="0 0 10 17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 1L1.5 8.5L9 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
    </div>
    <div class="detail-body">
      <div class="detail-fields">
        <div class="detail-field">
          <label>Route</label>
          <p id="detail-name" class="detail-route-name"></p>
        </div>
        <div class="detail-field">
          <label>Maintenance</label>
          <p id="detail-job"></p>
        </div>
        <div class="detail-field">
          <label>Date</label>
          <p id="detail-date"></p>
        </div>
        <div class="detail-field" id="detail-hardware-field">
          <label>Hardware</label>
          <p id="detail-hardware"></p>
        </div>
        <div class="detail-field">
          <label>Crag</label>
          <button class="btn-crag-filter" id="btn-crag-filter">
            <span id="detail-crag"></span>
            <svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L7 6.5L1 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

      </div>
    </div>
  </div>

</div>

<script>
  const routes = [
    { crag: "AFTERNOON", route: "TSOPANAKOS", job: "Fully rebolted; loose flake cleaned", hardware: "Stainless Steel Expansion 316L Marine", date: "October 2022" },
    { crag: "AFTERNOON", route: "BYE BYE DOC", job: "Fully rebolted", hardware: "Stainless Steel Glue-In 316L", date: "2015/16" },
    { crag: "AFTERNOON", route: "JANA'S KITCHEN", job: "Fully rebolted", hardware: "Stainless Steel Glue-In 316L", date: "2015/16" },
    { crag: "GHOST KITCHEN", route: "SPECTRAL EVIDENCE", job: "Anchors replaced", hardware: "Stainless Steel Glue-In 316L Marine", date: "March 2024" },
    { crag: "GHOST KITCHEN", route: "THE HAUNTING", job: "Fully rebolted", hardware: "Stainless Steel Expansion 316L Marine", date: "March 2024" },
    { crag: "GRANDE GROTTA", route: "SUPER BLASTER", job: "Fully rebolted", hardware: "Titanium Glue-In", date: "2019" },
    { crag: "GRANDE GROTTA", route: "AEGIALIS", job: "2 bolts replaced", hardware: "", date: "September 2023" },
    { crag: "POETS", route: "RIMBAUD", job: "Fully rebolted", hardware: "Stainless Steel Glue-In 316L Marine", date: "November 2022" },
  ];

  const $app     = document.getElementById("app");
  const $list    = document.getElementById("route-list");
  const $btnBack = document.getElementById("btn-back");
  const $btnCrag = document.getElementById("btn-crag-filter");

  let activeRoute = null;

  // Build list
  routes.forEach((r, i) => {
    const li = document.createElement("li");
    li.className = "card";
    li.innerHTML = `
      <span class="crag">${r.crag}</span>
      <div class="route-name">${r.route}</div>
      <div class="job-date">${r.job}<span class="date"> · ${r.date}</span></div>
    `;
    li.addEventListener("click", () => openDetail(r));
    $list.appendChild(li);
  });

  function openDetail(r) {
    activeRoute = r;
    document.getElementById("detail-crag").textContent     = r.crag;
    document.getElementById("detail-name").textContent     = r.route;
    document.getElementById("detail-job").textContent      = r.job;
    document.getElementById("detail-date").textContent     = r.date;
    document.getElementById("detail-hardware").textContent = r.hardware;
    document.getElementById("detail-hardware-field").hidden = !r.hardware;
    $app.classList.add("detail-open");
  }

  function closeDetail() {
    $app.classList.remove("detail-open");
  }

  $btnBack.addEventListener("click", closeDetail);

  $btnCrag.addEventListener("click", () => {
    closeDetail();
    // In the real app: addTerm(activeRoute.crag, "crag")
    alert(`→ Filter gesetzt: ${activeRoute.crag}\n(In der echten App: Chip wird gesetzt, Liste filtert sich)`);
  });
</script>
</body>
</html>
