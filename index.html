<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Rebolt Log · Kalymnos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />

</head>
<body>
  <div class="app" id="app">
  <div class="panel">
  <header>
    <div class="header-row">
      <a href="https://reboltkalymnos.org" target="_blank" rel="noopener">
        <picture>
          <source srcset="icons/rk-logo-dark.svg" media="(prefers-color-scheme: light)" />
          <img src="icons/rk-logo-white.svg" alt="Rebolt Kalymnos" class="logo" />
        </picture>
      </a>
      <button id="burger" class="burger" aria-label="Menu" aria-expanded="false">
        <div class="icon-wrap">
          <svg class="icon-wrench" viewBox="0 0 24 24" width="28" height="28" fill="currentColor" aria-hidden="true">
            <g transform="rotate(40 12 12)">
              <rect x="10.7" y="5" width="2.6" height="14" rx="1.2"/>
              <circle cx="12" cy="5" r="4.5"/>
              <polygon points="14.77,5 13.39,7.4 10.61,7.4 9.23,5 10.61,2.6 13.39,2.6" style="fill: var(--bg)"/>
              <circle cx="12" cy="19" r="3.6"/>
              <polygon points="14.19,19 13.1,20.9 10.9,20.9 9.81,19 10.9,17.1 13.1,17.1" style="fill: var(--bg)"/>
            </g>
          </svg>
          <svg class="icon-close" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </div>
      </button>
    </div>
    <div class="search-wrapper">
      <input
        id="search"
        type="search"
        placeholder="Search crags, routes, years…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        role="combobox"
        aria-expanded="false"
        aria-controls="autocomplete"
        aria-haspopup="listbox"
      />
      <ul id="autocomplete" class="autocomplete" role="listbox" hidden></ul>
    </div>
    <div id="chips" class="chips-row" role="group" aria-label="Active filters"></div>
  </header>

  <main>
    <p id="status" class="status">Loading…</p>
    <p id="count" class="count" hidden></p>
    <ul id="list" class="route-list" role="list"></ul>
    <p id="empty" class="empty" hidden>No routes match your search.</p>
  </main>
  </div><!-- /.panel -->

  <!-- DETAIL PANEL -->
  <div class="panel detail-panel">
    <div class="detail-header">
      <button class="btn-back" id="btn-back">
        <svg width="10" height="17" viewBox="0 0 10 17" fill="none">
          <path d="M9 1L1.5 8.5L9 16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
    </div>
    <div class="detail-body">
      <div class="detail-fields">
        <div class="detail-field">
          <label>Route</label>
          <p id="detail-name" class="detail-route-name"></p>
        </div>
        <div class="detail-field">
          <label>Maintenance</label>
          <p id="detail-job"></p>
        </div>
        <div class="detail-field">
          <label>Date</label>
          <p id="detail-date"></p>
        </div>
        <div class="detail-field" id="detail-hardware-field">
          <label>Hardware</label>
          <p id="detail-hardware"></p>
        </div>
        <div class="detail-field">
          <label>Crag</label>
          <button class="btn-crag-filter" id="btn-crag-filter">
            <span id="detail-crag"></span>
            <svg width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1 1L7 6.5L1 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div><!-- /.detail-panel -->

  </div><!-- /.app -->

  <!-- Wrench menu -->
  <nav id="menu-nav" class="menu-nav" aria-hidden="true">
    <div class="menu-header">
      <a href="https://reboltkalymnos.org" target="_blank" rel="noopener">
        <picture>
          <source srcset="icons/rk-logo-dark.svg" media="(prefers-color-scheme: light)" />
          <img src="icons/rk-logo-white.svg" alt="Rebolt Kalymnos" class="logo" />
        </picture>
      </a>
      <button id="menu-close" class="burger" aria-label="Close menu">
        <div class="icon-wrap">
          <svg class="icon-close icon-close--visible" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </div>
      </button>
    </div>
    <div class="menu-items">
      <a href="https://www.paypal.com/donate?hosted_button_id=KAPNTJCPV2BWA" target="_blank" rel="noopener" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Donate
      </a>
      <a href="https://baserow.io/form/py5Vu2kY0YDMY1i7iO1_ddMspuyz7D48OJ7Urrvh0fY" target="_blank" rel="noopener" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        Report an issue
      </a>
      <button id="btn-install" class="nav-item" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Install App
      </button>
      <div class="nav-divider"></div>
      <button class="nav-item" id="btn-reload">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>Last update: <span id="menu-updated"></span></span>
      </button>
      <a href="https://reboltkalymnos.org/#social" target="_blank" rel="noopener" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Imprint
      </a>
      <div class="nav-divider"></div>
      <div class="nav-credit">
        Data from <a href="https://reboltkalymnos.org/rebolt-log/" target="_blank" rel="noopener">reboltkalymnos.org</a><br>
        maintained by Rebolt Kalymnos volunteers<br>
        Unofficial mobile view
      </div>
    </div>
  </nav>

  <div id="ios-banner" class="ios-banner" hidden>
    <span>Tippe auf <strong>⬆</strong> → <strong>Zum Home-Bildschirm</strong> für Offline-Nutzung</span>
    <button id="ios-banner-close" aria-label="Schließen">✕</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
