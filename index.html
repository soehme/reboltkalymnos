<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Rebolt Kalymnos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <a href="https://reboltkalymnos.org" target="_blank" rel="noopener" class="logo-link">
        <img src="https://reboltkalymnos.org/rk-logo-white.svg" alt="Rebolt Kalymnos" class="logo" />
      </a>
      <span id="updated-badge" class="badge" hidden></span>
    </div>

    <div class="action-row">
      <a href="https://www.paypal.com/donate?hosted_button_id=KAPNTJCPV2BWA" target="_blank" rel="noopener" class="btn-action">Donate</a>
      <a href="https://baserow.io/form/py5Vu2kY0YDMY1i7iO1_ddMspuyz7D48OJ7Urrvh0fY" target="_blank" rel="noopener" class="btn-action">Report an issue</a>
    </div>

    <div class="search-row">
      <input
        id="search"
        type="search"
        placeholder="Search crag or route…"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      />
    </div>
    <div id="crag-filters" class="chip-row" role="group" aria-label="Filter by crag"></div>
  </header>

  <main>
    <p id="status" class="status">Loading…</p>
    <p id="count" class="count" hidden></p>
    <ul id="list" class="route-list" role="list"></ul>
    <p id="empty" class="empty" hidden>No routes match your search.</p>
  </main>

  <footer>
    <p>Data from <a href="https://reboltkalymnos.org/rebolt-log/" target="_blank" rel="noopener">reboltkalymnos.org</a> — maintained by the Rebolt Kalymnos team.</p>
    <p>This app is an unofficial mobile view. All credit goes to the volunteers who do the work.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
