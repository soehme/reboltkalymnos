name: Scrape Rebolt Log

on:
  # Daily cron disabled: reboltkalymnos.org was relaunched and no longer
  # publishes the CSV.csv route log this scraper depends on (confirmed via
  # sitemap.xml and probing /kalymnos, /kalymnos/report - both 404).
  # Re-enable the schedule below once the site exposes the data again.
  # schedule:
  #   - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/routes.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update routes data $(date -u +%Y-%m-%d)"
          git push
